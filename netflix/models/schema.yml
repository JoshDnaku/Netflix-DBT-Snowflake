version: 2

# Model documentation + data tests. Descriptions feed `dbt docs`; tests run
# with `dbt test`. Note: `unique` tests are intentionally commented out where
# the data does not guarantee uniqueness (asserting a false constraint would
# fail the suite and teach nothing). They are left as documentation of intent.

models:
  - name: dim_movies
    description: Dimension table for cleansed movie metadata.
    columns:
      - name: movie_id
        description: Primary key of the movie.
        tests:
          # - unique   # not guaranteed unique in raw MovieLens; left as intent
          - not_null
      - name: movie_title
        description: Standardized (trimmed, title-cased) movie title.
        tests:
          - not_null
      - name: genre_array
        description: Genres as an array (split from the pipe-delimited string).
      - name: genres
        description: Raw pipe-delimited genre string from source.

  - name: dim_users
    description: Dimension of unique users, unioned from ratings and tags.
    columns:
      - name: user_id
        description: Unique user identifier.
        tests:
          # - unique   # left as intent
          - not_null

  - name: dim_genome_tags
    description: Dimension of genome tag labels.
    columns:
      - name: tag_id
        description: Unique tag ID.
        tests:
          - not_null
          # - unique   # left as intent
      - name: tag_name
        description: Cleaned, human-readable tag name.
        tests:
          - not_null

  - name: fct_ratings
    description: Fact table of user ratings for movies (incremental).
    columns:
      - name: user_id
        description: Foreign key to dim_users.
        tests:
          - not_null
      - name: movie_id
        description: Foreign key to dim_movies.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_movies')
                field: movie_id
      - name: rating
        description: User's rating for a movie.
        tests:
          - not_null
      - name: rating_timestamp
        description: Timestamp when the rating was made.

  - name: fct_genome_scores
    description: Fact table of relevance scores per movie and tag.
    columns:
      - name: movie_id
        description: Foreign key to dim_movies.
        tests:
          - not_null
      - name: tag_id
        description: Foreign key to dim_genome_tags.
        tests:
          - not_null
      - name: relevance_score
        description: Relevance score (0-1) of a tag's association with a movie.
        tests:
          - not_null
